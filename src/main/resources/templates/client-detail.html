<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <div class="app-shell">
      <nav th:replace="~{layout :: nav}"></nav>
      <div class="content">
        <header th:replace="~{layout :: header}"></header>
        <main>
          <div th:replace="~{layout :: notices}"></div>
          <h1>
            Clients 
            <span th:text="'#' + ${record.id}"></span>
          </h1>
          <a sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:href="@{/clients/{id}/edit(id=${record.id})}">Modifier</a>
          <a th:href="@{/clients}">Retour</a>
          <table>
            <tr>
              <th>Nom</th>
              <td th:text="${record.name != null ? record.name : '—'}"></td>
            </tr>
            <tr>
              <th>E-mail</th>
              <td th:text="${record.email != null ? record.email : '—'}"></td>
            </tr>
            <tr>
              <th>Téléphone</th>
              <td th:text="${record.phone != null ? record.phone : '—'}"></td>
            </tr>
            <tr>
              <th>Adresse</th>
              <td th:text="${record.address != null ? record.address : '—'}"></td>
            </tr>
          </table>
          <h2>Historique</h2>
          <ul>
            <li th:each="e : ${audit}">
              <strong th:text="${e.action}"></strong>
              <span th:text="${e.actor + ' · ' + #temporals.format(e.occurredAt,'dd/MM/yyyy HH:mm')}"></span>
            </li>
          </ul>
          <form sec:authorize="hasAnyRole('ADMIN','MANAGER')" method="post" th:action="@{/clients/{id}/delete(id=${record.id})}" onsubmit="return confirm('Supprimer cet enregistrement ?')">
            <button>Supprimer</button>
          </form>
        </main>
      </div>
    </div>
  </body>
</html>
