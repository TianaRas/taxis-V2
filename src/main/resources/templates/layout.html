<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} ?: 'Taxis V2'">Taxis V2</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- ================= TOPBAR ================= -->
<div th:fragment="header" class="topbar">
  <div class="topbar__left">
    <button class="topbar__toggle" id="sidebarToggle" type="button" aria-label="Menu">
      <i class="bi bi-list"></i>
    </button>
    <span class="topbar__title" th:text="${title} ?: 'Tableau de bord'">Tableau de bord</span>
  </div>

  <div class="topbar__right">
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Changer de thème">
      <i class="bi bi-moon-stars"></i>
    </button>

    <div class="user-chip" sec:authorize="isAuthenticated()">
      <span class="user-chip__avatar"
            th:text="${#authentication.name != null ? #strings.substring(#authentication.name,0,1).toUpperCase() : '?'}">A</span>
      <span class="user-chip__name" sec:authentication="name">admin</span>
    </div>

    <form method="post" th:action="@{/logout}" sec:authorize="isAuthenticated()" style="margin:0;">
      <button type="submit" class="logout-btn">
        <i class="bi bi-box-arrow-right"></i>
        <span>Déconnexion</span>
      </button>
    </form>
  </div>
</div>

<!-- ================= SIDEBAR ================= -->
<aside th:fragment="nav" class="sidebar" id="sidebar">
  <a class="sidebar__brand" th:href="@{/}">
    <i class="bi bi-taxi-front-fill"></i>
    <span>Taxis V2</span>
  </a>

  <nav class="sidebar__nav">
    <div class="sidebar__section">Navigation</div>

    <a class="sidebar__link" th:href="@{/}">
      <i class="bi bi-speedometer2"></i><span>Accueil</span>
    </a>
    <a class="sidebar__link" th:href="@{/clients}">
      <i class="bi bi-people"></i><span>Clients</span>
    </a>
    <a class="sidebar__link" th:href="@{/vehicles}">
      <i class="bi bi-truck"></i><span>Véhicules</span>
    </a>
    <a class="sidebar__link" th:href="@{/drivers}">
      <i class="bi bi-person-badge"></i><span>Chauffeurs</span>
    </a>
    <a class="sidebar__link" th:href="@{/rides}">
      <i class="bi bi-signpost-2"></i><span>Courses</span>
    </a>
    <a class="sidebar__link" th:href="@{/statistics}">
      <i class="bi bi-bar-chart"></i><span>Statistiques</span>
    </a>

    <div class="sidebar__section" sec:authorize="hasRole('ADMIN')">Administration</div>
    <a class="sidebar__link" th:href="@{/settings}" sec:authorize="hasRole('ADMIN')">
      <i class="bi bi-sliders"></i><span>Paramètres</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <span>© Taxis V2</span>
  </div>
</aside>

<!-- Backdrop mobile -->
<div class="backdrop" id="backdrop"></div>

<!-- ================= NOTICES ================= -->
<div th:fragment="notices">
  <p class="message success" th:if="${success}" th:text="${success}"></p>
  <p class="message error" role="alert" th:if="${error}" th:text="${error}"></p>
</div>

<!-- ================= METRICS (cards) ================= -->
<div th:fragment="metrics" class="metrics">
  <div class="metric" th:each="metric : ${stats.metrics}">
    <div class="metric__label" th:text="${metric.key}">Libellé</div>
    <div class="metric__value" th:text="${metric.value}">0</div>
  </div>
</div>

<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
