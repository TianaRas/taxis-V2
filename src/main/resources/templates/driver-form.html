<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <div class="app-shell">
      <nav th:replace="~{layout :: nav}"></nav>
      <div class="content">
        <header th:replace="~{layout :: header}"></header>
        <main>
          <div th:replace="~{layout :: notices}"></div>
          <h1 th:text="${editing ? 'Modifier' : 'Ajouter'}"></h1>
          <a th:href="@{/drivers}">Retour</a>
          <form method="post" th:action="${editing ? path + '/' + id + '/edit' : path}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>
              Nom
              <input name="name" type="text" required th:value="${record != null ? record.name : null}">
            </label>
            <label>
              Téléphone
              <input name="phone" type="text" required th:value="${record != null ? record.phone : null}">
            </label>
            <label>
              Permis
              <input name="licenseNumber" type="text" required th:value="${record != null ? record.licenseNumber : null}">
            </label>
            <label>
              Validité permis
              <input name="licenseExpiry" type="date" required th:value="${record != null ? record.licenseExpiry : null}">
            </label>
            <label>
              Embauche
              <input name="hiredAt" type="date" required th:value="${record != null ? record.hiredAt : null}">
            </label>
            <label>
              Véhicule
              <select name="vehicleId" required>
                <option value="">Choisir</option>
                <option th:each="choice : ${vehicleIdChoices}" th:value="${choice.id}" th:text="${choice.plate}" th:selected="${record != null and record.vehicleId == choice.id}"></option>
              </select>
            </label>
            <label>
              Distance au départ (km)
              <input name="distanceToPickup" type="number" required step="0.01" min="0" th:value="${record != null ? record.distanceToPickup : null}">
            </label>
            <label>
              Statut
              <select name="status">
                <option value="DISPONIBLE" th:selected="${record != null and record.status == 'DISPONIBLE'}">Disponible</option>
                <option value="EN_PAUSE" th:selected="${record != null and record.status == 'EN_PAUSE'}">En pause</option>
                <option value="INDISPONIBLE" th:selected="${record != null and record.status == 'INDISPONIBLE'}">Indisponible</option>
                <option value="SUSPENDU" th:selected="${record != null and record.status == 'SUSPENDU'}">Suspendu</option>
              </select>
            </label>
            <button>Enregistrer</button>
            <a th:href="@{/drivers}">Annuler</a>
          </form>
        </main>
      </div>
    </div>
  </body>
</html>
