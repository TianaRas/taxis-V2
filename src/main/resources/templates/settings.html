<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <div class="app-shell">
      <nav th:replace="~{layout :: nav}"></nav>
      <div class="content">
        <header th:replace="~{layout :: header}"></header>
        <main>
          <div th:replace="~{layout :: notices}"></div>
          <h1>Paramètres</h1>
          <form method="post" th:action="@{/settings}" th:each="setting : ${settings}">
            <label th:text="${setting.label}"></label>
            <input type="hidden" name="name" th:value="${setting.name}">
            <input type="number" step="0.01" min="0" max="1000000" name="value" th:value="${setting.value}" required>
            <button>Enregistrer</button>
          </form>
        </main>
      </div>
    </div>
  </body>
</html>
